[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usb_insight_hub"
description = "Host library and tools for the Jetperch USB Insight Hub firmware"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Jetperch LLC", email = "joulescope-dev@jetperch.com"}]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "pyserial>=3.5",
    "esptool>=5.1,<6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
uih = "usb_insight_hub.cli:main"

[tool.setuptools.dynamic]
version = {attr = "usb_insight_hub.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
