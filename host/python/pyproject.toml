[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usb_insight_hub_jetperch"
description = "Host library and tools for Jetperch's replacement USB Insight Hub firmware"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Jetperch LLC", email = "joulescope-dev@jetperch.com"}]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Hub",
]
dependencies = [
    "pyserial>=3.5",
    "esptool>=5.1,<6",
]

[project.urls]
Homepage = "https://github.com/jetperch/usb_insight_hub"
Issues = "https://github.com/jetperch/usb_insight_hub/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
uih = "usb_insight_hub.cli:main"

[tool.setuptools.dynamic]
version = {attr = "usb_insight_hub.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
